<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEAST Compose</title>
    <link rel="icon" type="image/png" href="/img/beast_head_logo_small.png" />
    <link rel="stylesheet" href="/css/roboto.css" />
    <link rel="stylesheet" href="/css/material_icons.css" />
    <style>
      /* Spin animation used by transitional UI elements (e.g. the start/stop button
         while a request is in flight). Kept here -- alongside the icon font import --
         so the bundled JS doesn't have to inject a <style> element at runtime. */
      @keyframes beast-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
    </style>
    <script src="/js/react.18.production.min.js"></script>
    <script src="/js/react-dom.18.2.0.production.min.js"></script>
    <script src="/js/material-ui.production.min.js"></script>
    <script src="/js/konva.8.3.1.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./js/index.js"></script>
  </body>
</html>
